# Tfole Store — local development stack.
#
# Odoo 19 Community + Postgres 16. The addon is bind-mounted so QWeb/XML edits
# apply on refresh (see the --dev flags on the odoo command below).
#
# Production (Phase 8) gets its own compose file with a reverse proxy,
# proxy_mode = True and the database manager disabled.

services:
  db:
    image: postgres:16
    container_name: tfole-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
      # Odoo creates databases itself; this keeps initdb from getting clever.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  odoo:
    image: odoo:19
    container_name: tfole-odoo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
      # gevent/websocket port. Unused while workers = 0, exposed so the dev
      # stack matches the production topology (Phase 8 proxies both).
      - "${ODOO_GEVENT_PORT:-8072}:8072"
    environment:
      HOST: db
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:-odoo}
    volumes:
      # The filestore. Product images live here, not in Postgres — a database
      # dump without this volume has no images.
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo:ro
    # --dev=xml,qweb,reload is the whole point of the local stack: without it
    # every template edit needs a container restart.
    command: >
      odoo
      --config=/etc/odoo/odoo.conf
      --dev=xml,qweb,reload
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
