; Tfole Store — LOCAL DEVELOPMENT config.
;
; Production (Phase 8) uses a separate config with proxy_mode = True,
; list_db = False and a real admin_passwd.

[options]
; Our module first, then Odoo's own addons. Never edit anything under the
; second path — extend via inheritance only.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; The filestore. Backed by the odoo-data named volume — product images live
; here, not in Postgres.
data_dir = /var/lib/odoo

; Database ------------------------------------------------------------------
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Serve only the tfole database, so /web never shows a database picker once
; the database exists.
dbfilter = ^tfole$

; Local only. Phase 8 sets this to False on the public host and gives
; admin_passwd a real value.
list_db = True
admin_passwd = tfole-dev-only

; Server --------------------------------------------------------------------
; Threaded mode. --dev=reload needs a single process, and the websocket is
; served on 8069 rather than the gevent port while workers = 0.
workers = 0
max_cron_threads = 1

http_port = 8069
gevent_port = 8072

; Explicit because Odoo 20.0 flips the default to 127.0.0.1, which would make
; the container unreachable from the host. Railway (Phase 8) needs 0.0.0.0 too:
; its edge reaches the container over the private network, so binding to
; localhost there shows up as "Application failed to respond".
http_interface = 0.0.0.0

; proxy_mode is a Phase 8 concern: switching it on without a proxy in front
; makes Odoo trust X-Forwarded-* headers from anyone. On Railway it must be
; True, because Railway's edge terminates TLS.
proxy_mode = False

; Logging -------------------------------------------------------------------
log_level = info
logfile = None

; No demo data in any database we build on. Odoo 19 made this a plain boolean;
; the old 'all' value is silently coerced and logs a warning.
without_demo = True
